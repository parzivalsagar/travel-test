<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login |The Chikkamagaluru Escape!!
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-bg">

    <!-- LOGIN CONTAINER -->
    <div class="login-wrapper">
        <div class="login-box">

            <h2>Welcome Traveller 🌿</h2>
            <p class="login-sub">
                Begin your peaceful journey to Chikkamagaluru
            </p>

            <!-- INPUTS -->
            <input type="text" id="name" class="form-control" placeholder="Full Name">

            <input type="email" id="email" class="form-control mt-3" placeholder="Email Address">

            <input type="password" id="password" class="form-control mt-3" placeholder="Password">

            <!-- BUTTONS -->
            <button class="btn btn-success w-100 mt-4" onclick="register()">
                Create Account
            </button>

            <button class="btn btn-outline-success w-100 mt-2" onclick="login()">
                Login
            </button>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auth Logic -->
    <script src="auth.js"></script>

</body>

</html>
