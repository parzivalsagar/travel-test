<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Booking Details | Chikkamagaluru Travel</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-bg">

    <div class="login-wrapper">
        <div class="login-box">

            <h2>Booking Details 🧾</h2>
            <p class="login-sub">
                Complete your journey to Chikkamagaluru
            </p>

            <!-- BOOKING FORM -->
            <input type="text" class="form-control" placeholder="Full Name">

            <input type="tel" class="form-control mt-3" placeholder="Mobile Number">

            <input type="email" class="form-control mt-3" placeholder="Email Address">

            <input type="date" class="form-control mt-3">

            <select class="form-control mt-3">
                <option selected disabled>Number of Travellers</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4+</option>
            </select>

            <textarea class="form-control mt-3" rows="3" placeholder="Any special requests (optional)"></textarea>

            <!-- CONFIRM BUTTON -->
            <button class="btn btn-success w-100 mt-4" onclick="confirmBooking()">
                Confirm Booking
            </button>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Booking Script -->
    <script src="js/booking.js"></script>

</body>

</html>
